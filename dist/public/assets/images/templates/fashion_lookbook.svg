<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="heroGrad_fashion_lookbook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow_fashion_lookbook" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="800" height="500" rx="16" fill="#F8FAF8"/>

  <!-- Browser Frame Header -->
  <rect width="800" height="36" rx="16" fill="#F1F5F2"/>
  <rect y="20" width="800" height="16" fill="#F1F5F2"/>
  <circle cx="24" cy="18" r="5" fill="#EF4444"/>
  <circle cx="40" cy="18" r="5" fill="#F59E0B"/>
  <circle cx="56" cy="18" r="5" fill="#10B981"/>

  <!-- URL Address Bar -->
  <rect x="180" y="7" width="440" height="22" rx="6" fill="#FFFFFF" stroke="#E3E9E5"/>
  <text x="400" y="22" font-size="11" fill="#6B756F" text-anchor="middle" font-family="'JetBrains Mono', monospace">🔒 zlik.store/official-store</text>

  <!-- Store Navigation Header -->
  <g transform="translate(0, 36)">
    <rect width="800" height="52" fill="#FFFFFF" stroke="#E3E9E5" stroke-width="1"/>
    
    <!-- Store Brand / Logo -->
    <rect x="24" y="10" width="32" height="32" rx="8" fill="#BE185D"/>
    <text x="40" y="31" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Z</text>
    <text x="66" y="27" font-size="13" font-weight="bold" fill="#08110D">LUXE AURA</text>
    <text x="66" y="38" font-size="9.5" fill="#10B981" font-weight="bold">● VERIFIED STORE</text>

    <!-- Search Mockup -->
    <rect x="240" y="12" width="300" height="28" rx="8" fill="#F8FAF8" stroke="#E3E9E5"/>
    <text x="255" y="30" font-size="11" fill="#9CA3AF">🔍 Search products, categories...</text>

    <!-- Cart / Chat Buttons -->
    <rect x="690" y="11" width="86" height="30" rx="8" fill="#08110D"/>
    <text x="733" y="30" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🛒 Cart (2)</text>
  </g>

  <!-- Hero Spotlight Section -->
  <g transform="translate(0, 88)">
    <rect width="800" height="135" fill="url(#heroGrad_fashion_lookbook)"/>
    
    <!-- Category &amp; Plan Badge -->
    <rect x="24" y="16" width="110" height="22" rx="11" fill="#FCE7F3" stroke="#BE185D" stroke-width="1"/>
    <text x="34" y="31" font-size="10" font-weight="bold" fill="#BE185D">FREE STARTER</text>

    <!-- Hero Headline -->
    <text x="24" y="62" font-size="20" font-weight="800" fill="#08110D">New Season Collections &amp; Wardrobe Staples</text>
    <text x="24" y="82" font-size="12" fill="#6B756F">Select your preferred size and color combinations with live stock updates.</text>

    <!-- Delivery / Service Badges -->
    <rect x="24" y="98" width="130" height="22" rx="6" fill="rgba(0,0,0,0.05)"/>
    <text x="32" y="113" font-size="10" font-weight="bold" fill="#08110D">⚡ 24h Express Dispatch</text>

    <rect x="162" y="98" width="125" height="22" rx="6" fill="rgba(0,0,0,0.05)"/>
    <text x="170" y="113" font-size="10" font-weight="bold" fill="#08110D">💬 WhatsApp Live Chat</text>
  </g>

  <!-- 3 Product Cards Showcase Grid -->
  <g transform="translate(0, 235)">
    
        <g transform="translate(24, 0)" filter="url(#shadow_fashion_lookbook)">
          <rect width="240" height="245" rx="14" fill="#FFFFFF" stroke="#E3E9E5" stroke-width="1"/>
          
          <!-- Image Box Mockup with Center Visual Icon -->
          <rect x="10" y="10" width="220" height="115" rx="10" fill="#FCE7F3"/>
          <text x="120" y="78" font-size="42" text-anchor="middle">👗</text>
          
          

          <!-- Product Title -->
          <text x="14" y="145" font-size="12" font-weight="bold" fill="#08110D">Silk Evening Gown</text>
          
          <!-- Price &amp; Old Price -->
          <text x="14" y="168" font-size="14" font-weight="800" fill="#BE185D">₦35,000</text>
          

          <!-- Variant Chips / Attribute preview -->
          
            <g transform="translate(14, 180)">
              
                <rect x="0" y="0" width="56" height="18" rx="4" fill="#F1F5F2" stroke="#E3E9E5"/>
                <text x="28" y="12" font-size="9" font-weight="bold" fill="#08110D" text-anchor="middle">XS</text>
              
                <rect x="62" y="0" width="56" height="18" rx="4" fill="#F1F5F2" stroke="#E3E9E5"/>
                <text x="90" y="12" font-size="9" font-weight="bold" fill="#08110D" text-anchor="middle">S</text>
              
                <rect x="124" y="0" width="56" height="18" rx="4" fill="#F1F5F2" stroke="#E3E9E5"/>
                <text x="152" y="12" font-size="9" font-weight="bold" fill="#08110D" text-anchor="middle">M</text>
              
            </g>
          

          <!-- Order Button -->
          <rect x="14" y="206" width="212" height="28" rx="8" fill="#08110D"/>
          <text x="120" y="224" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Add to Cart 🛒</text>
        </g>
      
        <g transform="translate(280, 0)" filter="url(#shadow_fashion_lookbook)">
          <rect width="240" height="245" rx="14" fill="#FFFFFF" stroke="#E3E9E5" stroke-width="1"/>
          
          <!-- Image Box Mockup with Center Visual Icon -->
          <rect x="10" y="10" width="220" height="115" rx="10" fill="#FDF2F8"/>
          <text x="120" y="78" font-size="42" text-anchor="middle">🧥</text>
          
          

          <!-- Product Title -->
          <text x="14" y="145" font-size="12" font-weight="bold" fill="#08110D">Tailored Italian Linen Blazer</text>
          
          <!-- Price &amp; Old Price -->
          <text x="14" y="168" font-size="14" font-weight="800" fill="#BE185D">₦42,000</text>
          

          <!-- Variant Chips / Attribute preview -->
          
            <g transform="translate(14, 180)">
              
                <rect x="0" y="0" width="56" height="18" rx="4" fill="#F1F5F2" stroke="#E3E9E5"/>
                <text x="28" y="12" font-size="9" font-weight="bold" fill="#08110D" text-anchor="middle">38</text>
              
                <rect x="62" y="0" width="56" height="18" rx="4" fill="#F1F5F2" stroke="#E3E9E5"/>
                <text x="90" y="12" font-size="9" font-weight="bold" fill="#08110D" text-anchor="middle">40</text>
              
                <rect x="124" y="0" width="56" height="18" rx="4" fill="#F1F5F2" stroke="#E3E9E5"/>
                <text x="152" y="12" font-size="9" font-weight="bold" fill="#08110D" text-anchor="middle">42</text>
              
            </g>
          

          <!-- Order Button -->
          <rect x="14" y="206" width="212" height="28" rx="8" fill="#08110D"/>
          <text x="120" y="224" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Add to Cart 🛒</text>
        </g>
      
        <g transform="translate(536, 0)" filter="url(#shadow_fashion_lookbook)">
          <rect width="240" height="245" rx="14" fill="#FFFFFF" stroke="#E3E9E5" stroke-width="1"/>
          
          <!-- Image Box Mockup with Center Visual Icon -->
          <rect x="10" y="10" width="220" height="115" rx="10" fill="#FFF1F2"/>
          <text x="120" y="78" font-size="42" text-anchor="middle">👜</text>
          
          

          <!-- Product Title -->
          <text x="14" y="145" font-size="12" font-weight="bold" fill="#08110D">Genuine Leather Crossbody Bag</text>
          
          <!-- Price &amp; Old Price -->
          <text x="14" y="168" font-size="14" font-weight="800" fill="#BE185D">₦28,500</text>
          

          <!-- Variant Chips / Attribute preview -->
          
            <g transform="translate(14, 180)">
              
                <rect x="0" y="0" width="56" height="18" rx="4" fill="#F1F5F2" stroke="#E3E9E5"/>
                <text x="28" y="12" font-size="9" font-weight="bold" fill="#08110D" text-anchor="middle">Black</text>
              
                <rect x="62" y="0" width="56" height="18" rx="4" fill="#F1F5F2" stroke="#E3E9E5"/>
                <text x="90" y="12" font-size="9" font-weight="bold" fill="#08110D" text-anchor="middle">Tan</text>
              
            </g>
          

          <!-- Order Button -->
          <rect x="14" y="206" width="212" height="28" rx="8" fill="#08110D"/>
          <text x="120" y="224" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Add to Cart 🛒</text>
        </g>
      
  </g>

  <!-- Aesthetic Watermark Ribbon for Pro Themes -->
  
</svg>