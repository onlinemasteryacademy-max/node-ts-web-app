<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="heroGrad_electronics_compare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082F49"/>
      <stop offset="100%" stop-color="#03141F"/>
    </linearGradient>
    <filter id="shadow_electronics_compare" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="800" height="500" rx="16" fill="#08110D"/>

  <!-- Browser Frame Header -->
  <rect width="800" height="36" rx="16" fill="#0F1713"/>
  <rect y="20" width="800" height="16" fill="#0F1713"/>
  <circle cx="24" cy="18" r="5" fill="#EF4444"/>
  <circle cx="40" cy="18" r="5" fill="#F59E0B"/>
  <circle cx="56" cy="18" r="5" fill="#10B981"/>

  <!-- URL Address Bar -->
  <rect x="180" y="7" width="440" height="22" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)"/>
  <text x="400" y="22" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-family="'JetBrains Mono', monospace">🔒 zlik.store/official-store</text>

  <!-- Store Navigation Header -->
  <g transform="translate(0, 36)">
    <rect width="800" height="52" fill="#08110D" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Store Brand / Logo -->
    <rect x="24" y="10" width="32" height="32" rx="8" fill="#0284C7"/>
    <text x="40" y="31" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Z</text>
    <text x="66" y="27" font-size="13" font-weight="bold" fill="#FFFFFF">LUXE AURA</text>
    <text x="66" y="38" font-size="9.5" fill="#10B981" font-weight="bold">● VERIFIED STORE</text>

    <!-- Search Mockup -->
    <rect x="240" y="12" width="300" height="28" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)"/>
    <text x="255" y="30" font-size="11" fill="rgba(255,255,255,0.5)">🔍 Search products, categories...</text>

    <!-- Cart / Chat Buttons -->
    <rect x="690" y="11" width="86" height="30" rx="8" fill="#19D98B"/>
    <text x="733" y="30" font-size="11" font-weight="bold" fill="#08110D" text-anchor="middle">🛒 Cart (2)</text>
  </g>

  <!-- Hero Spotlight Section -->
  <g transform="translate(0, 88)">
    <rect width="800" height="135" fill="url(#heroGrad_electronics_compare)"/>
    
    <!-- Category &amp; Plan Badge -->
    <rect x="24" y="16" width="130" height="22" rx="11" fill="rgba(255,255,255,0.15)" stroke="#0284C7" stroke-width="1"/>
    <text x="34" y="31" font-size="10" font-weight="bold" fill="#19D98B">PRO CERTIFIED 💎</text>

    <!-- Hero Headline -->
    <text x="24" y="62" font-size="20" font-weight="800" fill="#FFFFFF">Certified Authentic Devices with Verified Warranty</text>
    <text x="24" y="82" font-size="12" fill="rgba(255,255,255,0.75)">Every device undergoes a 40-point quality check with our official seal.</text>

    <!-- Delivery / Service Badges -->
    <rect x="24" y="98" width="130" height="22" rx="6" fill="rgba(255,255,255,0.1)"/>
    <text x="32" y="113" font-size="10" font-weight="bold" fill="#FFFFFF">⚡ 24h Express Dispatch</text>

    <rect x="162" y="98" width="125" height="22" rx="6" fill="rgba(255,255,255,0.1)"/>
    <text x="170" y="113" font-size="10" font-weight="bold" fill="#FFFFFF">💬 WhatsApp Live Chat</text>
  </g>

  <!-- 3 Product Cards Showcase Grid -->
  <g transform="translate(0, 235)">
    
        <g transform="translate(24, 0)" filter="url(#shadow_electronics_compare)">
          <rect width="240" height="245" rx="14" fill="#121915" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
          
          <!-- Image Box Mockup with Center Visual Icon -->
          <rect x="10" y="10" width="220" height="115" rx="10" fill="#0C4A6E"/>
          <text x="120" y="78" font-size="42" text-anchor="middle">📱</text>
          
          
            <rect x="18" y="18" width="100" height="18" rx="5" fill="#EF4444"/>
            <text x="26" y="31" font-size="9" font-weight="bold" fill="#FFFFFF">40-PT TESTED</text>
          

          <!-- Product Title -->
          <text x="14" y="145" font-size="12" font-weight="bold" fill="#FFFFFF">iPhone 15 Pro Max 256GB</text>
          
          <!-- Price &amp; Old Price -->
          <text x="14" y="168" font-size="14" font-weight="800" fill="#0284C7">₦1,150,000</text>
          

          <!-- Variant Chips / Attribute preview -->
          
            <g transform="translate(14, 180)">
              
                <rect x="0" y="0" width="56" height="18" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)"/>
                <text x="28" y="12" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Grade A+</text>
              
                <rect x="62" y="0" width="56" height="18" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)"/>
                <text x="90" y="12" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Factory Sealed</text>
              
            </g>
          

          <!-- Order Button -->
          <rect x="14" y="206" width="212" height="28" rx="8" fill="#19D98B"/>
          <text x="120" y="224" font-size="11" font-weight="bold" fill="#08110D" text-anchor="middle">Add to Cart 🛒</text>
        </g>
      
        <g transform="translate(280, 0)" filter="url(#shadow_electronics_compare)">
          <rect width="240" height="245" rx="14" fill="#121915" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
          
          <!-- Image Box Mockup with Center Visual Icon -->
          <rect x="10" y="10" width="220" height="115" rx="10" fill="#0C4A6E"/>
          <text x="120" y="78" font-size="42" text-anchor="middle">💻</text>
          
          
            <rect x="18" y="18" width="100" height="18" rx="5" fill="#08110D"/>
            <text x="26" y="31" font-size="9" font-weight="bold" fill="#FFFFFF">100% BATTERY</text>
          

          <!-- Product Title -->
          <text x="14" y="145" font-size="12" font-weight="bold" fill="#FFFFFF">M3 Pro MacBook 14" Space Black</text>
          
          <!-- Price &amp; Old Price -->
          <text x="14" y="168" font-size="14" font-weight="800" fill="#0284C7">₦1,920,000</text>
          

          <!-- Variant Chips / Attribute preview -->
          
            <g transform="translate(14, 180)">
              
                <rect x="0" y="0" width="56" height="18" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)"/>
                <text x="28" y="12" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">512GB</text>
              
                <rect x="62" y="0" width="56" height="18" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)"/>
                <text x="90" y="12" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1TB</text>
              
            </g>
          

          <!-- Order Button -->
          <rect x="14" y="206" width="212" height="28" rx="8" fill="#19D98B"/>
          <text x="120" y="224" font-size="11" font-weight="bold" fill="#08110D" text-anchor="middle">Add to Cart 🛒</text>
        </g>
      
        <g transform="translate(536, 0)" filter="url(#shadow_electronics_compare)">
          <rect width="240" height="245" rx="14" fill="#121915" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
          
          <!-- Image Box Mockup with Center Visual Icon -->
          <rect x="10" y="10" width="220" height="115" rx="10" fill="#0C4A6E"/>
          <text x="120" y="78" font-size="42" text-anchor="middle">⌚</text>
          
          
            <rect x="18" y="18" width="107" height="18" rx="5" fill="#08110D"/>
            <text x="26" y="31" font-size="9" font-weight="bold" fill="#FFFFFF">1 YR WARRANTY</text>
          

          <!-- Product Title -->
          <text x="14" y="145" font-size="12" font-weight="bold" fill="#FFFFFF">Smart Watch Ultra Cellular 49mm</text>
          
          <!-- Price &amp; Old Price -->
          <text x="14" y="168" font-size="14" font-weight="800" fill="#0284C7">₦280,000</text>
          

          <!-- Variant Chips / Attribute preview -->
          
            <g transform="translate(14, 182)">
              <text x="0" y="10" font-size="10" fill="#9CA3AF">✓ In Stock • Instant Add to WhatsApp Cart</text>
            </g>
          

          <!-- Order Button -->
          <rect x="14" y="206" width="212" height="28" rx="8" fill="#19D98B"/>
          <text x="120" y="224" font-size="11" font-weight="bold" fill="#08110D" text-anchor="middle">Add to Cart 🛒</text>
        </g>
      
  </g>

  <!-- Aesthetic Watermark Ribbon for Pro Themes -->
  
    <g transform="translate(680, 440)">
      <rect width="96" height="24" rx="12" fill="#08110D" stroke="#19D98B" stroke-width="1.5"/>
      <text x="48" y="16" font-size="10" font-weight="bold" fill="#19D98B" text-anchor="middle">💎 PRO THEME</text>
    </g>
  
</svg>